<head>
    <style>
        .banner {
            width: 100%;
            height: 15vh;
            border: .1vw solid black;
        }

        body {
            background-color: black;
            overflow: hidden;
        }

        @keyframes blink {
            0% {
                opacity: 1
            }
            50% {
                opacity: 0.2
            }
            100% {
                opacity: 1
            }
        }

        @keyframes fadein {
            0% {
                opacity: 0;
            }
            100% {
                opacity: 1;
            }
        }

        @keyframes fadeout {
            0% {
                opacity: 1;
            }
            100% {
                opacity: 0;

            }
        }

        .star {
            width: 2.5px;
            height: 2.5px;
            animation: blink 2s infinite;
            background-color: white;
            border-radius: 100%;
        }

        .explosion {
            width: 700px;
            height: 700px;
            animation: fadeout 3s;
            background-color: rgb(255, 153, 0);
            border-radius: 100%;
        }

        #btn1 {
            animation: fadein 3.5s;
        }
        
        #btn2 {
            animation: fadein 3.5s;
        }
    </style>
</head>
<body>
    <div class="banner">
        <p style="color: white; font-size: 32pt; font-family:monospace; animation: fadein 1.5s ease-in">QuikArit: Not so fast as you think</p>
    </div>
    <a id="btn1" style="font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
    color: white; font-size: 18pt;" href="https://github.com/Lucas-doubleC/quikarit">See repo on GitHub</a></button>
    <br>
    <a id="btn2" style="font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
    color: white; font-size: 18pt;" href="https://lucascampos.top/quikarit/docs">See docs</a>
</body>
<script>
    for (let i = 0; i <= 250; i++) {
        let newstar = document.createElement("div");
        newstar.classList.add("star");
        newstar.style.position = "absolute";
        newstar.style.left = Math.random() * 100 + "%";
        newstar.style.top = Math.random() * 100 + "%";
        newstar.style.animationDelay = Math.random() * 2.5 + "s"
        document.body.appendChild(newstar)
    }

    function gmousecoords(e) {
        return [e.clientX, e.clientY]
    }

    let timer = 0;

    document.addEventListener("mousemove", (e) => {
        if (timer < 1) {
            timer += 0.1;
        }
        else {
            let newstar = document.createElement("div");
            newstar.classList.add("star");
            newstar.style.position = "absolute";
            newstar.style.left = gmousecoords(e)[0] + "px";
            newstar.style.top = gmousecoords(e)[1] + "px";
            newstar.style.animationDelay = Math.random() * 2.5 + "s"
            document.body.appendChild(newstar)
            timer = 0;
        }
    })

</script>
